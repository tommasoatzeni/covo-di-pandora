###############################################################################
# DNSMASQ CONFIGURATION - Mobile Lab Router  (Void Linux / X230 "pataccone")
###############################################################################
# Used by: net-client (Void edition) — run as a dedicated dnsmasq instance,
#          NOT as the system service. The interface is forced on the command
#          line by net-client (--interface), so we keep this file portable.
# Network: 192.168.1.0/24
# Gateway: 192.168.1.1 (this machine, pataccone)
# WAN:     4G modem via enp0s20u1 (managed by NetworkManager)
###############################################################################

# Bind only to the LAN; net-client also passes --interface/--bind-interfaces.
interface=enp0s25
bind-interfaces

# DHCP pool: 192.168.1.50-150, 12h lease
dhcp-range=192.168.1.50,192.168.1.150,12h

# Gateway + DNS handed to DHCP clients (this machine)
dhcp-option=3,192.168.1.1
dhcp-option=6,192.168.1.1

# --- Static leases (lab hosts) -------------------------------------------
dhcp-host=ea:9b:28:73:26:8c,pandora,192.168.1.10,infinite
dhcp-host=52:54:00:ff:f0:bb,proxmox,192.168.1.20,infinite
dhcp-host=bc:24:11:88:35:83,bongola,192.168.1.30,infinite
dhcp-host=bc:24:11:9a:1e:1d,baghero,192.168.1.31,infinite
# NOTE: pataccone (3c:97:0e:64:35:4c) is THIS router at .1 — no DHCP lease
#       for itself. (The old conf gave it .21 when another box was gateway.)

# Logging
log-dhcp

# --- Split DNS: dominio .lan ---------------------------------------------
domain=lan
local=/lan/
server=1.1.1.1
server=8.8.8.8
address=/pataccone.lan/192.168.1.1
address=/pandora.lan/192.168.1.10
address=/pandora-rescue.lan/192.168.1.11
address=/proxmox.lan/192.168.1.20
address=/bongola.lan/192.168.1.30
address=/baghero.lan/192.168.1.31
address=/opnsense.lan/192.168.1.254
expand-hosts

# End of configuration
